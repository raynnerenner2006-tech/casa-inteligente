<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casa Inteligente</title>

    <style>
        /* Estilos padrão (Tema Escuro) */
        body {
            background: #142238;
            color: white;
            font-family: Arial;
            text-align: center;
            transition: 0.3s; /* Suaviza a transição de cores */
        }

        .painel {
            width: 320px;
            margin: 30px auto;
            padding: 20px;
            background: #203650;
            border-radius: 15px;
            transition: 0.3s;
        }

        /* Imagem JPEG */
        .foto {
            width: 100%;
            height: 130px;
            object-fit: cover;
            border-radius: 10px;
        }

        /* Imagem SVG */
        .icone {
            width: 65px;
        }

        /* Imagem PNG */
        .logo {
            width: 70px;
        }

        /* Imagem GIF */
        .gif {
            width: 35px;
        }

        button {
            background: #FCD34D;
            color: #142238;
            padding: 12px 25px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        /* --- CLASSE PARA O TEMA CLARO --- */
        body.modo-claro {
            background: #d9fa01;
            color: #142238;
        }

        body.modo-claro .painel {
            background: #ddf503;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }

        body.modo-claro button {
            background: #142238;
            color: #FCD34D;
        }
    </style>
</head>

<body>

    <div class="painel">

        <h2>Minha Casa Inteligente</h2>

        <!-- JPEG: fotografia da sala -->
        <img src="sala.jpg" class="foto" alt="Sala de estar">

        <br><br>

        <!-- SVG: ícone vetorial -->
        <img src="lampada.svg" class="icone" alt="Ícone de lâmpada">

        <h1>Luz da sala</h1>

        <!-- PNG: imagem com transparência -->
        <img src="lampada.png" class="logo" alt="Ilustração de lâmpada">

        <br>

        <!-- GIF: imagem animada -->
        <img src="brilho.gif" class="gif" alt="Brilho animado">

        <br><br>

        <button onclick="alternarTema()">Mudar Tema</button>

        <p id="resultado">Luz desligada</p>

    </div>

    <script>
        function alternarTema() {
            // Pega o elemento body da página
            let corpo = document.body;

            // O método .toggle() adiciona a classe se ela não existir, ou remove se já existir
            corpo.classList.toggle("modo-claro");
        }
    </script>

</body>
</html>
